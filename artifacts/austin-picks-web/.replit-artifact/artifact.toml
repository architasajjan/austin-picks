kind = "web"
previewPath = "/"
title = "Austin Picks"
description = "AI-powered Austin restaurant recommendations — React SPA + FastAPI/Node.js backend."
version = "1.0.0"
id = "artifacts/austin-picks-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20609

[services.development]
run = "pnpm --filter @workspace/austin-picks-web run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/austin-picks-web", "run", "build"]

[services.production.run]
args = ["pnpm", "--filter", "@workspace/austin-picks-web", "run", "serve"]

[services.production.run.env]
PORT = "20609"
BASE_PATH = "/"

[services.env]
PORT = "20609"
BASE_PATH = "/"
